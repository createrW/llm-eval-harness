[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "LLM evaluation harness with bootstrap confidence intervals, paired significance tests and variance decomposition across models x prompts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "createrW" }]
keywords = ["llm", "evaluation", "benchmark", "bootstrap", "statistics", "hellaswag", "gsm8k"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.5,<3",
  "transformers>=4.51,<6",
  "datasets>=3.0",
  "huggingface-hub>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "numpy>=1.26",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "tqdm>=4.66",
]

[project.optional-dependencies]
api = ["openai>=1.50", "anthropic>=0.40"]
dashboard = ["streamlit>=1.38", "plotly>=5.24"]
tracking = ["mlflow>=2.16"]
all = ["llm-eval-harness[api,dashboard,tracking]"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "pandas-stubs",
]

[project.scripts]
llm-eval = "llm_eval.cli:main"

[project.urls]
Homepage = "https://github.com/createrW/llm-eval-harness"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_eval"]

# CPU-only torch wheels on Linux keep CI and the Docker image small (the PyPI wheel drags ~3 GB of
# CUDA libraries). macOS keeps the default PyPI wheel (MPS). On a CUDA box, after `uv sync` run:
#   uv pip install --torch-backend=auto torch   # then use the activated .venv (not `uv run`)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: downloads a real model/dataset or needs network; deselected by default (run with -m slow)",
]
addopts = "-m 'not slow' --strict-markers -ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["llm_eval"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
