# Named hypotheses, pre-registered in the README on 2026-10-18 (commit b4be467 onwards) before
# any Day-2+ data existed. Each is one confirmatory comparison "a > b" judged by the README's
# decision rule. Model names are the config names in configs/eval/*.yaml.
- id: H1
  claim: few_shot_3 > zero_shot on GSM8K for Qwen2.5-0.5B
  task: gsm8k
  scoring: generation
  a: {model: qwen2.5-0.5b, prompt_variant: few_shot_3}
  b: {model: qwen2.5-0.5b, prompt_variant: zero_shot}
- id: H2
  claim: Llama-3.2-1B > Qwen2.5-0.5B on HellaSwag acc_norm (zero-shot)
  task: hellaswag
  scoring: loglikelihood
  a: {model: llama-3.2-1b, prompt_variant: zero_shot}
  b: {model: qwen2.5-0.5b, prompt_variant: zero_shot}
- id: H3
  claim: cot > zero_shot on GSM8K for Llama-3.2-1B
  task: gsm8k
  scoring: generation
  a: {model: llama-3.2-1b, prompt_variant: cot}
  b: {model: llama-3.2-1b, prompt_variant: zero_shot}
