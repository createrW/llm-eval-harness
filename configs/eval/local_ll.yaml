# HellaSwag model comparison by log-likelihood (lm-eval style; primary metric acc_norm).
# Chain-of-thought needs generation, so this family has two prompt variants; all three are compared
# in local_gen.yaml, where every model is scored the same way.
run_name: local_ll
seed: 42
models:
  - name: qwen2.5-0.5b
    provider: hf
    path: Qwen/Qwen2.5-0.5B
    revision: 060db6499f32faf8b98477b0a26969ef7d8b9987
    batch_size: 32
  - name: llama-3.2-1b
    provider: hf
    path: unsloth/Llama-3.2-1B  # ungated mirror of meta-llama/Llama-3.2-1B
    revision: 9535bd9b1d1dea6acafbdc4813b728796aeb28da
    batch_size: 32
tasks:
  - name: hellaswag
    n_examples: 500
prompt_variants: [zero_shot, few_shot_3]
